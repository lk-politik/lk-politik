<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fachbegriffe — Politik-LK</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root { --acc: #2d5986; --accL: #e8f0f8; --accG: rgba(45,89,134,.08); }

.fb-page-filter {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.fb-filter-btn {
  font-family: var(--ff-mono);
  font-size: .7rem;
  font-weight: 600;
  padding: .3em .8em;
  border: 1px solid currentColor;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .08em;
  transition: filter .12s, background .12s;
  /* color set per-category via inline style */
}

.fb-filter-btn:hover { filter: brightness(.85); }
.fb-filter-btn.active { /* background set via inline style in JS */ }

.fb-list { list-style: none; padding: 0; }

.fb-entry {
  background: var(--card);
  border: 1px solid var(--border-l);
  border-left: 4px solid var(--sw); /* overridden per-category by inline style */
  border-radius: var(--r);
  padding: .85rem 1.1rem;
  margin-bottom: .75rem;
}

.fb-entry-term {
  font-family: var(--ff-mono);
  font-size: .8rem;
  font-weight: 700;
  color: var(--sw); /* overridden per-category by inline style */
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: .3rem;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem;
}

.fb-cat-badge {
  font-size: .6rem;
  font-family: var(--ff-mono);
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--accG); /* overridden per-category by inline style */
  color: var(--acc);       /* overridden per-category by inline style */
  border: 1px solid currentColor;
  padding: .1em .55em;
  border-radius: 3px;
}

.fb-entry-def {
  font-size: .88rem;
  color: var(--ink2);
  line-height: 1.6;
  margin-bottom: .45rem;
}

.fb-entry-units {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
}

/* Compact unit-number chip — shared with tooltip */
.fb-unit-chip {
  display: inline-block;
  font-family: var(--ff-mono);
  font-size: .62rem;
  font-weight: 600;
  padding: .1em .45em;
  border-radius: 3px;
  border: 1px solid currentColor;
  line-height: 1.5;
  white-space: nowrap;
  text-decoration: none;
}
a.fb-unit-chip          { color: var(--acc); background: var(--accG); }
a.fb-unit-chip:hover    { filter: brightness(.88); }
span.fb-unit-chip.locked { color: var(--ink3); border-color: var(--border); }

.fb-empty {
  color: var(--ink3);
  font-style: italic;
  padding: 2rem 0;
  text-align: center;
}

#fb-search {
  width: 100%;
  max-width: 420px;
  padding: .55rem .85rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--ff-body);
  font-size: .9rem;
  background: var(--card);
  color: var(--ink);
  margin-bottom: 1.25rem;
}

#fb-search:focus { outline: none; border-color: var(--sw); }
</style>
</head>
<body>

<div class="page-wrap">

  <nav class="breadcrumb">
    <a href="index.html">Startseite</a>
    <span class="sep">›</span>
    <span class="current">Fachbegriffe</span>
  </nav>

  <div class="unit-header" style="text-align:left;border-bottom:none;padding-left:0">
    <h1>Fachbegriffe</h1>
    <p class="sub">Alle Fachbegriffe alphabetisch — klicke einen Begriff für die Definition an.</p>
  </div>

  <input type="search" id="fb-search" placeholder="Begriff suchen …" autocomplete="off">

  <div class="fb-page-filter" id="fb-filters">
    <button class="fb-filter-btn active" data-filter="all">Alle</button>
    <!-- Category buttons rendered by JS -->
  </div>

  <ul class="fb-list" id="fb-list">
    <li class="fb-empty">Lade Fachbegriffe …</li>
  </ul>

</div>

<script src="js/progress.js"></script>
<script src="data/glossary.js"></script>
<script src="data/units.js"></script>
<script>
(function () {
  /* ── Category colour palette (mirrors tooltips.js) ───── */
  /* Grey (formal/structural) + gold/amber (principled/active). No red. */
  var CAT_COLORS = {
    'Institution':       '#111827',
    'Rechtsakt':         '#1f2937',
    'Vertrag':           '#374151',
    'Verfahren':         '#4b5563',
    'Befugnis':          '#6b7280',
    'Prinzip':           '#a16207',
    'Integrationsstufe': '#b45309',
    'Posten':            '#ca8a04',
    'Instrument':        '#d97706',
    'Phänomen':          '#f59e0b'
  };
  function _catColor(cat) { return CAT_COLORS[cat] || '#4b5563'; }

  var _all    = [];
  var _filter = 'all';
  var _search = '';

  var listEl    = document.getElementById('fb-list');
  var filtersEl = document.getElementById('fb-filters');
  var searchEl  = document.getElementById('fb-search');
  var _units    = window._PLK_UNITS || [];

  function _unitHtml(unitId) {
    var unit  = _units.find(function (u) { return u.id === unitId; });
    var num   = unit ? unit.num   : unitId;
    var title = unit ? unit.title : ('Einheit ' + unitId);
    if (unit && unit.status === 'active' && unit.file) {
      return '<a class="fb-unit-chip" href="einheiten/' + unit.file + '" title="' + title + '">' + num + '</a>';
    }
    return '<span class="fb-unit-chip locked" title="' + title + '">' + num + '</span>';
  }

  function _render() {
    var items = _all.filter(function (g) {
      var matchCat    = _filter === 'all' || g.cat === _filter;
      var matchSearch = !_search ||
        g.term.toLowerCase().indexOf(_search) !== -1 ||
        g.def.toLowerCase().indexOf(_search) !== -1;
      return matchCat && matchSearch;
    });

    items.sort(function (a, b) { return a.term.localeCompare(b.term, 'de'); });

    if (!items.length) {
      listEl.innerHTML = '<li class="fb-empty">Keine Begriffe gefunden.</li>';
      return;
    }

    listEl.innerHTML = items.map(function (g) {
      var color    = _catColor(g.cat);
      var catBadge = g.cat
        ? '<span class="fb-cat-badge" style="color:' + color + ';background:' + color + '18">' + g.cat + '</span>'
        : '';
      var unitLinks = g.units.map(_unitHtml).join('');
      return '<li class="fb-entry" style="border-left-color:' + color + '">' +
        '<div class="fb-entry-term" style="color:' + color + '">' + g.term + catBadge + '</div>' +
        '<div class="fb-entry-def">' + g.def + '</div>' +
        '<div class="fb-entry-units">' + unitLinks + '</div>' +
        '</li>';
    }).join('');
  }

  /* colorOf: reads the color stored on the btn via data attr */
  function _colorOf(btn) { return btn.dataset.catColor || null; }

  function _applyBtnStyle(btn, active) {
    var color = _colorOf(btn);
    if (!color) {
      /* "Alle" button — use accent */
      btn.style.color = active ? 'var(--acc)' : 'var(--ink3)';
      btn.style.borderColor = active ? 'var(--acc)' : 'var(--border)';
      btn.style.background  = active ? 'var(--accG)' : '';
    } else {
      btn.style.color       = color;
      btn.style.borderColor = color;
      btn.style.background  = active ? color + '22' : color + '0c';
    }
  }

  function _setFilterActive(activeBtn) {
    filtersEl.querySelectorAll('.fb-filter-btn').forEach(function (b) {
      b.classList.remove('active');
      _applyBtnStyle(b, false);
    });
    activeBtn.classList.add('active');
    _applyBtnStyle(activeBtn, true);
  }

  function _buildFilters(data) {
    var catSet = {};
    data.forEach(function (g) { if (g.cat) catSet[g.cat] = true; });
    var cats = Object.keys(catSet).sort();
    cats.forEach(function (cat) {
      var color = _catColor(cat);
      var btn = document.createElement('button');
      btn.className = 'fb-filter-btn';
      btn.dataset.filter = cat;
      btn.dataset.catColor = color;
      btn.textContent = cat;
      _applyBtnStyle(btn, false);
      btn.addEventListener('click', function () {
        _filter = cat;
        _setFilterActive(btn);
        _render();
      });
      filtersEl.appendChild(btn);
    });

    var allBtn = filtersEl.querySelector('[data-filter="all"]');
    _applyBtnStyle(allBtn, true);  /* "Alle" starts active */
    allBtn.addEventListener('click', function () {
      _filter = 'all';
      _setFilterActive(allBtn);
      _render();
    });
  }

  searchEl.addEventListener('input', function () {
    _search = searchEl.value.trim().toLowerCase();
    _render();
  });

  /* Pre-fill search from ?q= URL param (linked from tooltips) */
  var urlQ = (location.search.match(/[?&]q=([^&]*)/) || [])[1];
  if (urlQ) {
    _search = decodeURIComponent(urlQ).toLowerCase();
    searchEl.value = decodeURIComponent(urlQ);
  }

  if (window._PLK_GLOSSARY && window._PLK_GLOSSARY.length) {
    _all = window._PLK_GLOSSARY;
    _buildFilters(_all);
    _render();
  } else {
    listEl.innerHTML = '<li class="fb-empty">Fachbegriffe konnten nicht geladen werden.</li>';
  }
})();
</script>

</body>
</html>
