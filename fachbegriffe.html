<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossar - Politik-LK</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root { --acc: #2d5986; --accL: #e8f0f8; --accG: rgba(45,89,134,.08); }

/* â”€â”€â”€ Filter area â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.gl-filters { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: .5rem; }

.gl-group {
  border: 1px solid var(--border-l);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--card);
  border-left: 3px solid var(--border);  /* overridden per group via JS */
}

.gl-group-head {
  display: flex;
  align-items: center;
  gap: .45rem;
  padding: .35rem .75rem;
  background: #f8fafc;
  font-family: var(--ff-mono);
  font-size: .6rem;
  font-weight: 700;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: .1em;
  border-bottom: 1px solid var(--border-l);
}

.gl-group-pills {
  display: flex;
  gap: .35rem;
  flex-wrap: wrap;
  padding: .4rem .75rem;
}

/* â”€â”€â”€ Pills â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.gl-pill {
  display: inline-flex;
  align-items: center;
  gap: .35em;
  font-family: var(--ff-mono);
  font-size: .65rem;
  font-weight: 600;
  padding: .25em .65em;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all .15s;
  background: transparent;
  color: var(--ink3);
  white-space: nowrap;
}
.gl-pill:hover { border-color: #9ca3af; color: var(--ink2); }
.gl-pill.active { color: #fff; }
.gl-pill-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.gl-pill-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  font-size: .82em;
  transform: translateY(-.02em);
}
.gl-pill .gl-pill-ct {
  opacity: .5;
  font-weight: 500;
  margin-left: .1em;
}
.gl-pill.active .gl-pill-ct { opacity: .8; }

/* "Alle" pill */
.gl-pill-all {
  font-family: var(--ff-mono);
  font-size: .68rem;
  font-weight: 700;
  padding: .3em .8em;
  border-radius: 99px;
  border: 1.5px solid var(--acc);
  cursor: pointer;
  transition: all .15s;
  background: var(--acc);
  color: #fff;
  display: inline-block;
  flex-shrink: 0;
}
.gl-pill-all.inactive {
  background: transparent;
  color: var(--ink3);
  border-color: var(--border);
}
.gl-pill-all:hover { filter: brightness(.92); }
.gl-pill-all .gl-pill-ct { opacity: .7; font-weight: 500; margin-left: .2em; }

/* â”€â”€â”€ Active filter tags (shown below groups) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.gl-active-tags {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
  align-items: center;
  min-height: 0;
}
.gl-active-tags:empty { display: none; }
.gl-active-tag {
  font-family: var(--ff-mono);
  font-size: .6rem;
  font-weight: 600;
  padding: .2em .55em;
  border-radius: 4px;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: .3em;
}
.gl-active-tag-x {
  cursor: pointer;
  opacity: .7;
  font-size: .7rem;
  line-height: 1;
}
.gl-active-tag-x:hover { opacity: 1; }

/* â”€â”€â”€ Status bar (Alle + tags + count in one row) â”€â”€â”€â”€â”€â”€â”€â”€ */
.gl-status-bar {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
  margin-bottom: .75rem;
}
#gl-all-wrap { display: inline-flex; flex-shrink: 0; gap: .35rem; align-items: center; }
.gl-count {
  font-family: var(--ff-mono);
  font-size: .7rem;
  color: var(--ink3);
  margin-left: auto;
  white-space: nowrap;
}

/* â”€â”€â”€ Entry cards â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.fb-list { list-style: none; padding: 0; }

.fb-entry {
  background: var(--card);
  border: 1px solid var(--border-l);
  border-left: 4px solid var(--sw);
  border-radius: var(--r);
  padding: .85rem 1.1rem;
  margin-bottom: .75rem;
}

.fb-entry-term {
  font-family: var(--ff-mono);
  font-size: .8rem;
  font-weight: 700;
  color: var(--sw);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: .3rem;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem;
}

.fb-cat-badge {
  font-size: .6rem;
  font-family: var(--ff-mono);
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--accG);
  color: var(--acc);
  border: 1px solid currentColor;
  padding: .1em .55em;
  border-radius: 3px;
}

.fb-entry-def {
  font-size: .88rem;
  color: var(--ink2);
  line-height: 1.6;
  margin-bottom: .45rem;
}

.fb-entry-units {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
}

.fb-unit-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--ff-mono);
  font-size: .65rem;
  font-weight: 500;
  padding: .18em .65em;
  border-radius: 99px;
  border: none;
  line-height: 1.2;
  white-space: nowrap;
  text-decoration: none;
}
a.fb-unit-chip          { color: var(--acc); background: var(--accL); }
a.fb-unit-chip:hover    { filter: brightness(.88); }
span.fb-unit-chip.locked { color: var(--ink3); background: var(--border-l); }

.fb-empty {
  color: var(--ink3);
  font-style: italic;
  padding: 2rem 0;
  text-align: center;
}

/* â”€â”€â”€ Search â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#fb-search {
  width: 100%;
  max-width: 460px;
  padding: .55rem .85rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--ff-body);
  font-size: .9rem;
  background: var(--card);
  color: var(--ink);
  margin-bottom: 1.25rem;
}
#fb-search:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 2px var(--accG); }

/* â”€â”€â”€ Responsive â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
@media (max-width: 600px) {
  .gl-group-pills { gap: .25rem; padding: .35rem .55rem; }
  .gl-pill { font-size: .6rem; padding: .2em .5em; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <nav class="breadcrumb">
    <a href="index.html">Startseite</a>
    <span class="sep">&rsaquo;</span>
    <span class="current">Glossar</span>
  </nav>

  <div class="unit-header" style="text-align:left;border-bottom:none;padding-left:0">
    <h1>Glossar</h1>
    <p class="sub" style="max-width:none;margin-left:0">Nachschlagewerk f&uuml;r alle Fachbegriffe des Kurses. Nutze die Kategorien oder die Suche zum Filtern.</p>
  </div>

  <input type="search" id="fb-search" placeholder="Begriff suchen ..." autocomplete="off">

  <div class="gl-filters" id="gl-filters">
    <!-- Populated by JS -->
  </div>

  <div class="gl-status-bar" id="gl-status-bar">
    <div id="gl-all-wrap"></div>
    <div class="gl-active-tags" id="gl-tags"></div>
    <div class="gl-count" id="gl-count"></div>
  </div>

  <ul class="fb-list" id="fb-list">
    <li class="fb-empty">Lade Fachbegriffe ...</li>
  </ul>

</div>

<script src="data/glossary.js"></script>
<script src="data/glossary-refs.js"></script>
<script src="data/units.js"></script>
<script>
(function () {
  /* â”€â”€ Category colour palette (mirrors tooltips.js) â”€â”€â”€â”€â”€ */
  var CAT_COLORS = {
    /* Akteure (blue) */
    'Organisation':      '#1e3a8a',
    'Institution':       '#2563eb',
    'Posten':            '#60a5fa',
    'Person':            '#0891b2',
    /* Rechtsrahmen (green, dark â†’ light) */
    'Vertrag':           '#166534',
    'Rechtsnorm':        '#16a34a',
    'Verfahren':         '#65a30d',
    /* Konzepte (amber â†’ yellow â†’ pink) */
    'Struktur':          '#b45309',
    'Prinzip':           '#ca8a04',
    'Modell':            '#eab308',
    'Ph\u00e4nomen':      '#db2777'
  };
  function _catColor(cat) { return CAT_COLORS[cat] || '#6b7280'; }

  /* Special badge rendering (overrides default color+18% bg) */
  var CAT_SPECIAL = {
    'Prinzip':  { bg: '#fefce8', fg: '#854d0e', border: '#e5d5a0' }
  };

  /* Inline SVG flags (mirrors tooltips.js _FLAGS) */
  var _FLAGS = {
    eu: '<svg viewBox="0 0 24 16" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="24" height="16" rx="1.5" fill="#003399"/><g fill="#FC0" transform="translate(12,8)"><circle r=".7" cx="0" cy="-3.5"/><circle r=".7" cx="1.75" cy="-3.03"/><circle r=".7" cx="3.03" cy="-1.75"/><circle r=".7" cx="3.5" cy="0"/><circle r=".7" cx="3.03" cy="1.75"/><circle r=".7" cx="1.75" cy="3.03"/><circle r=".7" cx="0" cy="3.5"/><circle r=".7" cx="-1.75" cy="3.03"/><circle r=".7" cx="-3.03" cy="1.75"/><circle r=".7" cx="-3.5" cy="0"/><circle r=".7" cx="-3.03" cy="-1.75"/><circle r=".7" cx="-1.75" cy="-3.03"/></g></svg>',
    de: '<svg viewBox="0 0 16 11" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="16" height="11" fill="#FC0"/><rect width="16" height="3.67" fill="#000"/><rect y="7.33" width="16" height="3.67" fill="#D00"/></svg>',
    lu: '<svg viewBox="0 0 16 11" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="16" height="3.67" fill="#EF3340"/><rect y="3.67" width="16" height="3.67" fill="#fff"/><rect y="7.33" width="16" height="3.67" fill="#00A3E0"/></svg>',
    mt: '<svg viewBox="0 0 16 11" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="8" height="11" fill="#fff"/><rect x="8" width="8" height="11" fill="#CF142B"/></svg>',
    pt: '<svg viewBox="0 0 16 11" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="6" height="11" fill="#006600"/><rect x="6" width="10" height="11" fill="#FF0000"/></svg>',
    ee: '<svg viewBox="0 0 16 11" style="width:16px;height:11px;vertical-align:middle;margin-right:.3rem"><rect width="16" height="3.67" fill="#0072CE"/><rect y="3.67" width="16" height="3.67" fill="#000"/><rect y="7.33" width="16" height="3.67" fill="#fff"/></svg>'
  };
  function _flagSvg(code) {
    if (!code) return '';
    if (Array.isArray(code)) {
      return code.map(function (c) { return _FLAGS[c] || ''; }).join('');
    }
    return _FLAGS[code] || '';
  }

  /* Chapter colour map */
  var CHAPTER_COLORS = {
    1: '#c24175',
    2: '#1f7a3f',
    3: '#2563eb',
    4: '#b88900',
    5: '#a16207',
    6: '#0f766e',
    7: '#8a8175'
  };
  var CHAPTER_LIGHTS = {
    1: '#fbe8f0',
    2: '#e8f4ec',
    3: '#e8f0f9',
    4: '#faf4df',
    5: '#fbf1e2',
    6: '#e5f5f3',
    7: '#f4f1ed'
  };
  var CHAPTER_NAMES  = {
    1: 'K1: BRD',
    2: 'K2: GG',
    3: 'K3: EU',
    4: 'K4: INT',
    5: 'K5: ECO',
    6: 'K6: EWZ',
    7: 'K7: SYS'
  };
  var CHIP_TEXT      = CHAPTER_COLORS;

  /* Group accent colours â€” left-border tint for each group box */
  var GROUP_ACCENTS = {
    'Kapitel':      '#6b7280',   /* neutral gray â€” chapters have individual colors */
    'Akteure':      '#2563eb',   /* blue family */
    'Rechtsrahmen': '#16a34a',   /* green family */
    'Konzepte':     '#ca8a04'    /* yellow family */
  };

  /* Category descriptions */
  var CAT_DESCRIPTIONS = {
    'Organisation':  '\u00dcberstaatliche oder internationale Zusammenschl\u00fcsse mit eigener Struktur und Mitgliedschaft.',
    'Institution':   'Organe und Einrichtungen innerhalb eines politischen Systems, die eine bestimmte Funktion aus\u00fcben.',
    'Posten':        'Politische \u00c4mter und Funktionen, unabh\u00e4ngig von der Person, die sie besetzt.',
    'Person':        'Historische oder aktuelle Einzelpersonen mit politischer Bedeutung.',
    'Vertrag':       'V\u00f6lkerrechtliche oder verfassungsrechtliche Grundlagentexte, die Rechte, Pflichten und Strukturen festlegen.',
    'Rechtsnorm':    'Konkrete Rechtsakte, Vorschriften oder kodifizierte Regeln, die aus einem Vertrag oder Gesetz hervorgehen.',
    'Verfahren':     'Formalisierte Abl\u00e4ufe und Prozesse der politischen Entscheidungsfindung.',
    'Struktur':      'Dauerhafte reale Ordnungssysteme, die den Rahmen politischen, wirtschaftlichen oder gesellschaftlichen Handelns bilden.',
    'Prinzip':       'Normative Leitideen und Grunds\u00e4tze, die politisches Handeln legitimieren oder begrenzen.',
    'Modell':        'Theoretische Erkl\u00e4rungsrahmen, Denkschulen und analytische Konzepte, die Wirklichkeit deuten, aber nicht selbst Wirklichkeit sind.',
    'Ph\u00e4nomen':  'Beobachtbare politische, gesellschaftliche oder wirtschaftliche Entwicklungen und Muster.'
  };

  /* â”€â”€ Super-groups â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  var SUPER_GROUPS = [
    { label: 'Kapitel',      type: 'chapter' },
    { label: 'Akteure',      cats: ['Organisation', 'Institution', 'Posten', 'Person'] },
    { label: 'Rechtsrahmen', cats: ['Vertrag', 'Rechtsnorm', 'Verfahren'] },
    { label: 'Konzepte',     cats: ['Struktur', 'Prinzip', 'Modell', 'Ph\u00e4nomen'] }
  ];

  var _all           = [];
  var _glossaryRefs  = window._PLK_GLOSSARY_REFS || {};
  var _filter        = 'all';
  var _chapterFilter = 'all';
  var _basisOnly     = false;
  var _search        = '';

  /* Separate pill tracking: chapter pills vs category pills */
  var _chapPills = [];
  var _catPills  = [];
  var _basisPill = null;
  var _allBtn    = null;

  var listEl    = document.getElementById('fb-list');
  var filtersEl = document.getElementById('gl-filters');
  var allWrapEl = document.getElementById('gl-all-wrap');
  var tagsEl    = document.getElementById('gl-tags');
  var searchEl  = document.getElementById('fb-search');
  var countEl   = document.getElementById('gl-count');
  var _units    = window._PLK_UNITS || [];

  /* â”€â”€ Unit chip renderer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _unitHtml(unitId) {
    var unit  = _units.find(function (u) { return u.id === unitId; });
    var num   = unit ? unit.num   : unitId;
    var title = unit ? unit.title : ('Einheit ' + unitId);
    var ch    = parseInt(unitId, 10);
    var fg    = CHAPTER_COLORS[ch] || '';
    var bg    = CHAPTER_LIGHTS[ch] || '';
    var cStyle = fg && bg ? 'color:' + fg + ';background:' + bg : '';
    if (unit && unit.status === 'active' && unit.file) {
      return '<a class="fb-unit-chip" href="einheiten/' + unit.file + '" title="' + title + '"' +
        (cStyle ? ' style="' + cStyle + '"' : '') + '>' + num + '</a>';
    }
    var lStyle = 'color:var(--ink3);background:var(--border-l)';
    return '<span class="fb-unit-chip locked" title="' + title + '"' +
      (lStyle ? ' style="' + lStyle + '"' : '') + '>' + num + '</span>';
  }

  function _unitIdsFor(term) {
    return _glossaryRefs[term] || [];
  }

  /* â”€â”€ Inline definition tagging (mirrors tooltips.js) â”€â”€â”€ */
  var _ADJ_END = /^(.*?)(e|en|em|er|es)$/i;

  function _flexPattern(term) {
    var escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.split(/(\s+)/).map(function (tok) {
      if (/^\s+$/.test(tok)) return tok;
      var raw = tok.replace(/\\(.)/g, '$1');
      var m = _ADJ_END.exec(raw);
      if (m && m[1].length >= 2) {
        var stem = m[1].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return stem + '(?:e|en|em|er|es)';
      }
      return tok;
    }).join('');
  }

  function _tagDefsInline(defText, excludeTerm) {
    if (!_all || !_all.length) return defText;
    var exLower = excludeTerm.toLowerCase();
    var inlineEntries = [];
    _all.forEach(function (g) {
      if (g.term.toLowerCase() !== exLower) {
        inlineEntries.push({ pattern: _flexPattern(g.term), term: g.term });
      }
      if (g.abbr) {
        var abbrs = typeof g.abbr === 'string' ? [g.abbr] : g.abbr;
        abbrs.forEach(function (a) {
          if (a.toLowerCase() !== exLower) {
            inlineEntries.push({ pattern: _flexPattern(a), term: g.term });
          }
        });
      }
    });
    inlineEntries.sort(function (a, b) { return b.pattern.length - a.pattern.length; });
    var patterns = inlineEntries.map(function (e) { return e.pattern; });
    if (!patterns.length) return defText;
    var re = new RegExp('\\b(' + patterns.join('|') + ')([a-z\u00e4\u00f6\u00fc\u00df]*)', 'gi');
    return defText.replace(re, function (full, base, suffix) {
      var resolved = null;
      for (var i = 0; i < inlineEntries.length; i++) {
        var testRe = new RegExp('^' + inlineEntries[i].pattern + '$', 'i');
        if (testRe.test(base)) { resolved = inlineEntries[i].term; break; }
      }
      var needsFb = (resolved && resolved.toLowerCase() !== base.toLowerCase()) || suffix;
      var fbVal = resolved || base;
      var attr = needsFb ? ' data-fb="' + fbVal + '"' : '';
      return '<strong class="fb" style="cursor:pointer"' + attr + '>' + base + suffix + '</strong>';
    });
  }

  /* â”€â”€ Main render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _render() {
    var items = _all.filter(function (g) {
      var matchCat     = _filter === 'all' || g.cat === _filter;
      var matchChapter = _chapterFilter === 'all' || g.chapter === _chapterFilter;
      var matchBasis   = !_basisOnly || g.basis;
      var abbrStr = g.abbr ? (typeof g.abbr === 'string' ? g.abbr : g.abbr.join(' ')).toLowerCase() : '';
      var matchSearch  = !_search ||
        g.term.toLowerCase().indexOf(_search) !== -1 ||
        g.def.toLowerCase().indexOf(_search) !== -1 ||
        abbrStr.indexOf(_search) !== -1;
      return matchCat && matchChapter && matchBasis && matchSearch;
    });

    items.sort(function (a, b) { return a.term.localeCompare(b.term, 'de'); });
    countEl.textContent = items.length + ' von ' + _all.length + ' Begriffen';

    if (!items.length) {
      listEl.innerHTML = '<li class="fb-empty">Keine Begriffe gefunden.</li>';
      return;
    }

    listEl.innerHTML = items.map(function (g) {
      var color    = _catColor(g.cat);
      var sp       = CAT_SPECIAL[g.cat];
      var catStyle = sp
        ? 'color:' + sp.fg + ';background:' + sp.bg + (sp.border ? ';border:1px solid ' + sp.border : '')
        : 'color:' + color + ';background:' + color + '18';
      var catBadge = g.cat
        ? '<span class="fb-cat-badge" style="' + catStyle + '">' + g.cat + '</span>'
        : '';
      var termColor   = color;
      var borderColor = color;
      var unitLinks = _unitIdsFor(g.term).map(_unitHtml).join('');
      var flagHtml = _flagSvg(g.flag);
      var temporalHtml = g.temporal
        ? '<span style="font-size:.65rem;color:#d97706;margin-left:.4rem;vertical-align:middle" title="Zeitgebundene Information">\u231b</span>'
        : '';
      var basisHtml = g.basis
        ? '<span style="font-size:.6rem;color:#ca8a04;margin-left:.35rem;vertical-align:middle" title="Lehrplan-Basisbegriff">\u2605</span>'
        : '';
      var crossLinks = [];
      if (g.institution) {
        crossLinks.push('<div style="margin-top:.3rem;font-size:.82rem;color:var(--ink3)">' +
          '&#9656; <strong class="fb" style="cursor:pointer;color:' + _catColor('Institution') + '">' + g.institution + '</strong></div>');
      }
      if (g.posten) {
        var seitStr = _mandateLabel(g.seit, g.bis);
        crossLinks.push('<div style="margin-top:.3rem;font-size:.82rem;color:var(--ink3)">' +
          seitStr + '<strong class="fb" style="cursor:pointer;color:' + _catColor('Posten') + '">' + g.posten + '</strong></div>');
      }
      if (g.person) {
        var pSeitStr = _mandateLabel(g.personSeit, g.personBis);
        crossLinks.push('<div style="margin-top:.3rem;font-size:.82rem;color:var(--ink3)">' +
          pSeitStr + '<strong class="fb" style="cursor:pointer;color:' + _catColor('Person') + '">' + g.person + '</strong></div>');
      }
      var crossLinkHtml = crossLinks.join('');
      return '<li class="fb-entry" data-term="' + g.term + '" style="border-left-color:' + borderColor + '">' +
        '<div class="fb-entry-term" style="color:' + termColor + '">' +
          (g.emoji ? '<span style="margin-right:.35rem">' + g.emoji + '</span>' : '') +
          flagHtml + g.term + temporalHtml + basisHtml + catBadge +
        '</div>' +
        '<div class="fb-entry-def">' + _tagDefsInline(g.def, g.term) + '</div>' +
        crossLinkHtml +
        '<div class="fb-entry-units">' + unitLinks + '</div>' +
        '</li>';
    }).join('');
  }

  /* â”€â”€ Pill styling helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _resetPill(p) {
    p.classList.remove('active');
    p.style.color = '';
    p.style.borderColor = '';
    p.style.background = '';
  }
  function _fillPill(p, color) {
    p.classList.add('active');
    p.style.borderColor = color;
    p.style.background = color;
    p.style.color = '#fff';
  }

  /* â”€â”€ Update "Alle" button state â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _syncAllBtn() {
    if (_filter === 'all' && _chapterFilter === 'all' && !_basisOnly) {
      _allBtn.classList.remove('inactive');
    } else {
      _allBtn.classList.add('inactive');
    }
  }

  /* â”€â”€ Active-tag bar (shows combined active filters) â”€â”€â”€â”€ */
  function _renderTags() {
    tagsEl.innerHTML = '';
    if (_chapterFilter !== 'all') {
      var chName = CHAPTER_NAMES[_chapterFilter] || ('K' + _chapterFilter);
      var chCol  = CHAPTER_COLORS[_chapterFilter] || 'var(--acc)';
      var tag = document.createElement('span');
      tag.className = 'gl-active-tag';
      tag.style.background = chCol;
      tag.innerHTML = chName + ' <span class="gl-active-tag-x">\u00d7</span>';
      tag.querySelector('.gl-active-tag-x').addEventListener('click', function () {
        _chapterFilter = 'all';
        _chapPills.forEach(_resetPill);
        _syncAllBtn();
        _renderTags();
        _render();
      });
      tagsEl.appendChild(tag);
    }
    if (_filter !== 'all') {
      var catCol = _catColor(_filter);
      var tag2 = document.createElement('span');
      tag2.className = 'gl-active-tag';
      tag2.style.background = catCol;
      tag2.innerHTML = _filter + ' <span class="gl-active-tag-x">\u00d7</span>';
      tag2.querySelector('.gl-active-tag-x').addEventListener('click', function () {
        _filter = 'all';
        _catPills.forEach(_resetPill);
        _syncAllBtn();
        _renderTags();
        _render();
      });
      tagsEl.appendChild(tag2);
    }
  }

  function _mandateLabel(start, end) {
    if (start && end) return start + '-' + end + ' &rarr; ';
    if (start) return 'Seit ' + start + ' \u2192 ';
    if (end) return 'Bis ' + end + ' \u2192 ';
    return '\u25b8 ';
  }

  /* â”€â”€ Build filter groups â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _buildFilters(data) {
    var catCounts = {};
    var chapCounts = {};
    data.forEach(function (g) {
      if (g.cat) catCounts[g.cat] = (catCounts[g.cat] || 0) + 1;
      if (g.chapter) chapCounts[g.chapter] = (chapCounts[g.chapter] || 0) + 1;
    });

    allWrapEl.innerHTML = '';

    /* "Alle" button */
    _allBtn = document.createElement('button');
    _allBtn.className = 'gl-pill-all';
    _allBtn.innerHTML = 'Alle <span class="gl-pill-ct">' + data.length + '</span>';
    _allBtn.addEventListener('click', function () {
      _filter = 'all'; _chapterFilter = 'all'; _basisOnly = false;
      _chapPills.forEach(_resetPill);
      _catPills.forEach(_resetPill);
      if (_basisPill) _resetPill(_basisPill);
      _syncAllBtn();
      _renderTags();
      _render();
    });
    allWrapEl.appendChild(_allBtn);

    /* â˜… Lehrplan toggle pill, directly right of "Alle" */
    var basisCount = data.filter(function (g) { return g.basis; }).length;
    _basisPill = null;
    if (basisCount) {
      _basisPill = document.createElement('button');
      _basisPill.className = 'gl-pill';
      _basisPill.innerHTML = '<span class="gl-pill-icon" style="color:#ca8a04">\u2605</span>' +
        'Lehrplan <span class="gl-pill-ct">' + basisCount + '</span>';
      _basisPill.addEventListener('click', function () {
        _basisOnly = !_basisOnly;
        if (_basisOnly) {
          _fillPill(_basisPill, '#ca8a04');
        } else {
          _resetPill(_basisPill);
        }
        _syncAllBtn();
        _renderTags();
        _render();
      });
      allWrapEl.appendChild(_basisPill);
    }

    filtersEl.innerHTML = '';

    SUPER_GROUPS.forEach(function (group) {
      var accent = GROUP_ACCENTS[group.label] || 'var(--border)';
      var groupDiv = document.createElement('div');
      groupDiv.className = 'gl-group';
      groupDiv.style.borderLeftColor = accent;

      var head = document.createElement('div');
      head.className = 'gl-group-head';
      head.textContent = group.label;
      groupDiv.appendChild(head);

      var pillsDiv = document.createElement('div');
      pillsDiv.className = 'gl-group-pills';

      /* Add category descriptions as tooltips on individual pills */

      if (group.type === 'chapter') {
        [1, 2, 3, 4, 5, 6, 7].forEach(function (ch) {
          var count = chapCounts[ch] || 0;
          var col = CHAPTER_COLORS[ch] || 'var(--acc)';
          var pill = document.createElement('button');
          pill.className = 'gl-pill';
          pill.innerHTML = '<span class="gl-pill-dot" style="background:' + col + '"></span>' +
            (CHAPTER_NAMES[ch] || 'K' + ch) +
            ' <span class="gl-pill-ct">' + count + '</span>';
          if (!count) {
            pill.style.opacity = '0.38';
            pill.style.pointerEvents = 'none';
            pill.style.cursor = 'default';
          } else {
            pill.addEventListener('click', function () {
              /* Toggle: click again to deselect */
              if (_chapterFilter === ch) {
                _chapterFilter = 'all';
                _resetPill(pill);
              } else {
                _chapterFilter = ch;
                _chapPills.forEach(_resetPill);
                _fillPill(pill, col);
              }
              _syncAllBtn();
              _renderTags();
              _render();
            });
          }
          _chapPills.push(pill);
          pillsDiv.appendChild(pill);
        });
      } else {
        group.cats.forEach(function (cat) {
          var count = catCounts[cat] || 0;
          var color = _catColor(cat);
          var pill = document.createElement('button');
          pill.className = 'gl-pill';
          if (CAT_DESCRIPTIONS[cat]) pill.title = CAT_DESCRIPTIONS[cat];
          pill.innerHTML = '<span class="gl-pill-dot" style="background:' + color + '"></span>' +
            cat +
            ' <span class="gl-pill-ct">' + count + '</span>';
          if (!count) {
            /* No entries yet â€” render muted, non-interactive */
            pill.style.opacity = '0.38';
            pill.style.pointerEvents = 'none';
            pill.style.cursor = 'default';
          } else {
            pill.addEventListener('click', function () {
              if (_filter === cat) {
                _filter = 'all';
                _resetPill(pill);
              } else {
                _filter = cat;
                _catPills.forEach(_resetPill);
                _fillPill(pill, color);
              }
              _syncAllBtn();
              _renderTags();
              _render();
            });
            _catPills.push(pill);
          }
          pillsDiv.appendChild(pill);
        });
      }

      groupDiv.appendChild(pillsDiv);
      filtersEl.appendChild(groupDiv);
    });

    /* Append unknown categories */
    var listed = {};
    SUPER_GROUPS.forEach(function (g) {
      if (g.cats) g.cats.forEach(function (c) { listed[c] = true; });
    });
    var extras = Object.keys(catCounts).filter(function (c) { return !listed[c]; });
    if (extras.length) {
      var groupDiv = document.createElement('div');
      groupDiv.className = 'gl-group';
      groupDiv.style.borderLeftColor = '#6b7280';
      var head = document.createElement('div');
      head.className = 'gl-group-head';
      head.textContent = 'Sonstige';
      groupDiv.appendChild(head);
      var pillsDiv = document.createElement('div');
      pillsDiv.className = 'gl-group-pills';
      extras.forEach(function (cat) {
        var color = _catColor(cat);
        var pill = document.createElement('button');
        pill.className = 'gl-pill';
        pill.innerHTML = '<span class="gl-pill-dot" style="background:' + color + '"></span>' +
          cat + ' <span class="gl-pill-ct">' + catCounts[cat] + '</span>';
        pill.addEventListener('click', function () {
          if (_filter === cat) {
            _filter = 'all'; _resetPill(pill);
          } else {
            _filter = cat; _catPills.forEach(_resetPill); _fillPill(pill, color);
          }
          _syncAllBtn(); _renderTags(); _render();
        });
        _catPills.push(pill);
        pillsDiv.appendChild(pill);
      });
      groupDiv.appendChild(pillsDiv);
      filtersEl.appendChild(groupDiv);
    }

  }

  /* â”€â”€ Search â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  searchEl.addEventListener('input', function () {
    _search = searchEl.value.trim().toLowerCase();
    _render();
  });

  var urlQ = (location.search.match(/[?&]q=([^&]*)/) || [])[1];
  if (urlQ) {
    _search = decodeURIComponent(urlQ).toLowerCase();
    searchEl.value = decodeURIComponent(urlQ);
  }

  /* â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  if (window._PLK_GLOSSARY && window._PLK_GLOSSARY.length) {
    _all = window._PLK_GLOSSARY;
    _buildFilters(_all);
    _render();
  } else {
    listEl.innerHTML = '<li class="fb-empty">Fachbegriffe konnten nicht geladen werden.</li>';
  }

  /* â”€â”€ Cross-link click handler â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
  function _findEntryByText(text) {
    var lower = text.toLowerCase();
    return _all.find(function (g) {
      if (g.term.toLowerCase() === lower) return true;
      if (!g.abbr) return false;
      var abbrs = typeof g.abbr === 'string' ? [g.abbr] : g.abbr;
      return abbrs.some(function (a) { return a.toLowerCase() === lower; });
    }) || null;
  }

  function _scrollToEntry(termText) {
    var entry = _findEntryByText(termText);
    if (!entry) return;

    _filter = 'all'; _chapterFilter = 'all';
    _search = ''; searchEl.value = '';
    _chapPills.forEach(_resetPill);
    _catPills.forEach(_resetPill);
    _syncAllBtn();
    _renderTags();
    _render();

    var target = listEl.querySelector('[data-term="' + entry.term + '"]');
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.style.transition = 'box-shadow .2s';
    target.style.boxShadow = '0 0 0 3px ' + _catColor(entry.cat) + '60';
    setTimeout(function () { target.style.boxShadow = ''; }, 2000);
  }

  listEl.addEventListener('click', function (e) {
    var t = e.target;
    if (t.tagName === 'STRONG' && t.className && t.className.indexOf('fb') !== -1) {
      e.preventDefault();
      e.stopPropagation();
      var termText = t.getAttribute('data-fb') || t.textContent.trim();
      _scrollToEntry(termText);
    }
  });
})();
</script>

</body>
</html>
