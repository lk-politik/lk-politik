<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politik-LK — SLP Perl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root { --acc: #2d5986; --accL: #e8f0f9; --accG: rgba(45,89,134,.08); }

    .site-header {
      text-align: center; padding: 2.5rem 1.5rem 2rem;
      border-bottom: 1px solid var(--border); margin-bottom: 2rem;
    }
    .site-header .school-label {
      font-family: var(--ff-mono); font-size: .75rem;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--ink3); margin-bottom: .6rem;
    }
    .site-header h1 { margin-bottom: .4rem; }
    .site-header .subtitle { font-size: 1rem; color: var(--ink2); }

    /* Global progress bar */
    .global-progress {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: .9rem 1.25rem;
      margin-bottom: 1.75rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .global-progress-label {
      font-family: var(--ff-mono); font-size: .68rem;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink3); white-space: nowrap;
    }
    .prog-bar {
      flex: 1; height: 6px; background: var(--border-l);
      border-radius: 99px; overflow: hidden;
    }
    .prog-bar-fill {
      height: 100%; border-radius: 99px; background: var(--acc);
      transition: width .4s ease;
    }
    .global-progress-pct {
      font-family: var(--ff-mono); font-size: .72rem;
      color: var(--ink3); white-space: nowrap;
    }

    /* Chapter accordion */
    .chapters { display: flex; flex-direction: column; gap: .6rem; }
    .chapter {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }
    .chapter-row {
      display: flex; align-items: center; gap: .9rem;
      padding: .9rem 1.25rem; cursor: pointer;
      user-select: none; transition: background .15s;
    }
    .chapter-row:hover { background: var(--accG); }
    .chapter-icon {
      font-family: var(--ff-mono); font-size: .65rem;
      color: var(--ink3); transition: transform .2s; flex-shrink: 0;
    }
    .chapter.open .chapter-icon { transform: rotate(90deg); }
    .chapter-name {
      font-family: var(--ff-head); font-size: 1rem;
      font-weight: 600; color: var(--ink); flex: 1;
    }
    .chapter-meta {
      font-family: var(--ff-mono); font-size: .65rem;
      color: var(--ink3); white-space: nowrap; flex-shrink: 0;
    }
    .chapter-prog {
      display: flex; align-items: center; gap: .55rem;
      flex-shrink: 0; min-width: 110px;
    }
    .chapter-prog .prog-bar { height: 5px; min-width: 60px; flex: 1; }
    .chapter-prog-pct {
      font-family: var(--ff-mono); font-size: .65rem;
      color: var(--ink3); min-width: 2.2rem; text-align: right;
    }

    /* Unit list */
    .unit-list { border-top: 1px solid var(--border-l); display: none; }
    .chapter.open .unit-list { display: block; }

    .unit-row {
      display: flex; align-items: center; gap: .85rem;
      padding: .7rem 1.25rem .7rem 2.75rem;
      border-bottom: 1px solid var(--border-l);
      text-decoration: none; color: inherit;
      transition: background .15s;
    }
    .unit-row:last-child { border-bottom: none; }
    a.unit-row:hover { background: var(--accG); }
    .unit-row.locked { opacity: .4; pointer-events: none; }

    .unit-num {
      font-family: var(--ff-mono); font-size: .65rem; font-weight: 500;
      color: var(--acc); background: var(--accL);
      border-radius: 99px; padding: .18em .65em;
      flex-shrink: 0; white-space: nowrap;
    }
    .unit-row.locked .unit-num { color: var(--ink3); background: var(--border-l); }
    .unit-title { font-size: .9rem; font-weight: 500; flex: 1; color: var(--ink); }
    .unit-prog {
      display: flex; align-items: center; gap: .5rem;
      flex-shrink: 0; min-width: 90px;
    }
    .unit-prog .prog-bar { height: 4px; min-width: 50px; }
    .unit-prog-pct {
      font-family: var(--ff-mono); font-size: .62rem;
      color: var(--ink3); min-width: 2rem; text-align: right;
    }
    .unit-arrow { font-size: .85rem; color: var(--ink3); flex-shrink: 0; }
    .unit-lock  { font-size: .75rem; color: var(--ink3); flex-shrink: 0; }

    @media (max-width: 600px) {
      .chapter-meta { display: none; }
      .unit-prog { min-width: 70px; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <p class="school-label">Deutsch-Luxemburgisches Schengen-Lyzeum Perl</p>
    <h1>Politik-Leistungskurs (GOS)</h1>
    <p class="subtitle">Digitale Lerneinheiten · Schuljahr 2025/26</p>
  </header>

  <div class="global-progress">
    <span class="global-progress-label">Gesamtfortschritt</span>
    <div class="prog-bar"><div class="prog-bar-fill" id="global-bar" style="width:0%"></div></div>
    <span class="global-progress-pct" id="global-pct">0 %</span>
  </div>

  <div class="chapters" id="chapters"></div>

  <div style="text-align:center;margin:1.5rem 0">
    <a href="fachbegriffe.html" style="font-family:var(--ff-head);font-size:.9rem;font-weight:600;color:var(--acc);text-decoration:none;border:1.5px solid var(--acc);padding:.4em 1.1em;border-radius:6px;">&#128218; Fachbegriffe</a>
  </div>

  <footer class="page-footer">
    <span>Politik-LK · Deutsch-Luxemburgisches Schengen-Lyzeum Perl</span>
    <span>© 2025/26</span>
  </footer>

</div>

<script src="js/progress.js"></script>
<script>
/* ==========================================================
   index.js (inline)
   ========================================================== */

var SECTIONS = [
  {
    id: 'methodik',
    label: 'Methodik',
    units: [
      { id: 'M-1', num: 'M.1', title: 'AB I — Wissen zeigen',              href: 'einheiten/m-1_ab1.html', status: 'pending', color: null },
      { id: 'M-2', num: 'M.2', title: 'AB II — Analysieren und Einordnen', href: 'einheiten/m-2_ab2.html', status: 'pending', color: null },
      { id: 'M-3', num: 'M.3', title: 'AB III — Politisch urteilen',        href: 'einheiten/m-3_ab3.html', status: 'pending', color: null }
    ]
  },
  {
    id: 'kap3',
    label: 'Kapitel 3 — Die Europäische Union',
    units: [
      { id: '3-2',  num: '3.2',  title: 'Die EU nach dem Vertrag von Lissabon',          href: 'einheiten/3-2_lissabon.html',         status: 'active',  color: '#2d5986' },
      { id: '3-3',  num: '3.3',  title: 'Gesetzgebung in der EU und in Deutschland',        href: 'einheiten/3-3_gesetzgebung.html',      status: 'active',  color: '#2d5986' },
      { id: '3-4',  num: '3.4',  title: 'Das Mehrebenensystem der EU',                    href: 'einheiten/3-4_mehrebenensystem.html',  status: 'pending', color: null },
      { id: '3-5',  num: '3.5',  title: 'Der Binnenmarkt und die vier Freiheiten',        href: 'einheiten/3-5_binnenmarkt.html',       status: 'pending', color: '#b45309' },
      { id: '3-6',  num: '3.6',  title: 'Stufen der wirtschaftlichen Integration',        href: 'einheiten/3-6_integration.html',       status: 'pending', color: null },
      { id: '3-7',  num: '3.7',  title: 'Die Eurozone',                                   href: 'einheiten/3-7_eurozone.html',          status: 'pending', color: null },
      { id: '3-8',  num: '3.8',  title: 'EZB und Stabilitätskriterien',                   href: 'einheiten/3-8_ezb.html',               status: 'pending', color: null },
      { id: '3-9',  num: '3.9',  title: 'Reform der Währungsunion',                       href: 'einheiten/3-9_reform.html',            status: 'pending', color: null },
      { id: '3-10', num: '3.10', title: 'GASP und ESVP',                                  href: 'einheiten/3-10_gasp.html',             status: 'pending', color: null },
      { id: '3-11', num: '3.11', title: 'Die Hohe Vertreterin',                           href: 'einheiten/3-11_hohe-vertreterin.html', status: 'pending', color: null },
      { id: '3-12', num: '3.12', title: 'Standpunkte zur Asylpolitik',                    href: 'einheiten/3-12_asyl.html',             status: 'pending', color: null },
      { id: '3-13', num: '3.13', title: 'Rechtliche Grundlagen der Asylpolitik',          href: 'einheiten/3-13_recht.html',            status: 'pending', color: null },
      { id: '3-14', num: '3.14', title: 'EU-Erweiterung',                                 href: 'einheiten/3-14_erweiterung.html',      status: 'pending', color: null },
      { id: '3-15', num: '3.15', title: 'Kopenhagener Kriterien und Beitrittskandidaten', href: 'einheiten/3-15_kopenhagen.html',       status: 'pending', color: null },
      { id: '3-16', num: '3.16', title: 'EU-Austritt',                                    href: 'einheiten/3-16_austritt.html',         status: 'pending', color: null },
      { id: '3-18', num: '3.18', title: 'Brexit: Großbritannien und die EU',              href: 'einheiten/3-18_brexit.html',           status: 'pending', color: null },
      { id: '3-19', num: '3.19', title: 'Bundesstaat, Staatenbund oder Staatenverbund?',  href: 'einheiten/3-19_integration.html',      status: 'pending', color: null },
      { id: '3-20', num: '3.20', title: 'Differenzierte Integration',                     href: 'einheiten/3-20_differenziert.html',    status: 'pending', color: null }
    ]
  }
];

/* ── Progress helpers ───────────────────────────────────── */
function _calcPct(id) {
  var prog = Progress.load(id);
  if (!prog) return 0;
  if (prog.unlocked) return 100;
  if (!prog.gates) return 0;
  var keys = Object.keys(prog.gates);
  if (!keys.length) return 0;
  var done = 0;
  for (var i = 0; i < keys.length; i++) {
    if (prog.gates[keys[i]]) done++;
  }
  return Math.round(done / keys.length * 100);
}

function _isComplete(id) {
  var prog = Progress.load(id);
  return prog !== null && prog.unlocked === true;
}

/* ── Render ─────────────────────────────────────────────── */
function _renderAll() {
  /* Collect all rendered (non-pending) units */
  var allRendered = [];
  SECTIONS.forEach(function (sec) {
    sec.units.forEach(function (u) {
      if (u.status !== 'pending') allRendered.push(u);
    });
  });

  /* Global progress */
  var globalPct = 0;
  if (allRendered.length) {
    var sum = 0;
    allRendered.forEach(function (u) { sum += _calcPct(u.id); });
    globalPct = Math.round(sum / allRendered.length);
  }
  document.getElementById('global-bar').style.width = globalPct + '%';
  document.getElementById('global-pct').textContent = globalPct + ' %';

  /* Chapter accordion */
  var container = document.getElementById('chapters');
  container.innerHTML = '';
  var firstChapter = true;

  SECTIONS.forEach(function (sec) {
    var rendered = [];
    sec.units.forEach(function (u) {
      if (u.status !== 'pending') rendered.push(u);
    });
    if (!rendered.length) return;

    /* Chapter aggregate */
    var chSum = 0;
    rendered.forEach(function (u) { chSum += _calcPct(u.id); });
    var chPct  = Math.round(chSum / rendered.length);
    var chColor = (rendered.length === 1 && rendered[0].color) ? rendered[0].color : 'var(--acc)';
    var unitWord = rendered.length === 1 ? 'Einheit' : 'Einheiten';

    var ch = document.createElement('div');
    ch.className = 'chapter' + (firstChapter ? ' open' : '');
    ch.id = 'ch-' + sec.id;
    firstChapter = false;

    ch.innerHTML =
      '<div class="chapter-row" onclick="toggleChapter(\'ch-' + sec.id + '\')">' +
        '<span class="chapter-icon">&#9658;</span>' +
        '<span class="chapter-name">' + sec.label + '</span>' +
        '<span class="chapter-meta">' + rendered.length + ' ' + unitWord + '</span>' +
        '<div class="chapter-prog">' +
          '<div class="prog-bar">' +
            '<div class="prog-bar-fill" style="width:' + chPct + '%;background:' + chColor + '"></div>' +
          '</div>' +
          '<span class="chapter-prog-pct">' + chPct + ' %</span>' +
        '</div>' +
      '</div>' +
      '<div class="unit-list" id="ul-' + sec.id + '"></div>';

    container.appendChild(ch);

    /* Unit rows */
    var ul = document.getElementById('ul-' + sec.id);
    rendered.forEach(function (u, idx) {
      var locked = idx > 0 && !_isComplete(rendered[idx - 1].id);
      var pct    = _calcPct(u.id);
      var barClr = u.color ? u.color : 'var(--acc)';
      var row;

      if (locked) {
        row = document.createElement('div');
        row.className = 'unit-row locked';
        row.innerHTML =
          '<span class="unit-num">' + u.num + '</span>' +
          '<span class="unit-title">' + u.title + '</span>' +
          '<div class="unit-prog">' +
            '<div class="prog-bar"><div class="prog-bar-fill" style="width:0%"></div></div>' +
            '<span class="unit-prog-pct">&#8212;</span>' +
          '</div>' +
          '<span class="unit-lock">&#128274;</span>';
      } else {
        row = document.createElement('a');
        row.className = 'unit-row';
        row.href = u.href;
        row.innerHTML =
          '<span class="unit-num">' + u.num + '</span>' +
          '<span class="unit-title">' + u.title + '</span>' +
          '<div class="unit-prog">' +
            '<div class="prog-bar"><div class="prog-bar-fill" style="width:' + pct + '%;background:' + barClr + '"></div></div>' +
            '<span class="unit-prog-pct">' + pct + ' %</span>' +
          '</div>' +
          '<span class="unit-arrow">&#8594;</span>';
      }
      ul.appendChild(row);
    });
  });
}

function toggleChapter(id) {
  var el = document.getElementById(id);
  var wasOpen = el.classList.contains('open');
  document.querySelectorAll('.chapter').forEach(function (c) { c.classList.remove('open'); });
  if (!wasOpen) el.classList.add('open');
}

/* ── Load units.json and merge into SECTIONS ──────────── */
function _mergeUnits(data) {
  var map = {};
  for (var i = 0; i < data.length; i++) {
    map[data[i].id] = data[i];
  }
  SECTIONS.forEach(function (sec) {
    sec.units.forEach(function (u) {
      var remote = map[u.id];
      if (!remote) return;
      if (remote.title)  u.title  = remote.title;
      if (remote.status) u.status = remote.status;
      if (remote.accent) u.color  = remote.accent;
    });
  });
}

document.addEventListener('DOMContentLoaded', function () {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'data/units.json', true);
  xhr.onload = function () {
    if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) {
      try { _mergeUnits(JSON.parse(xhr.responseText)); } catch (e) { console.warn('[index] units.json parse error', e); }
    }
    _renderAll();
  };
  xhr.onerror = function () { _renderAll(); };
  xhr.send();
});
</script>
</body>
</html>
